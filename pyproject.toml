[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jumar-project"
version = "0.1.0"
description = "Django backend for order and production planning."
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
  "Django==4.1.7",
  "django-cors-headers==4.3.1",
  "django-environ==0.11.2",
  "django-extensions==3.2.1",
  "djangorestframework==3.14.0",
  "PyMySQL==1.1.0",
  "gunicorn==20.1.0",
  "whitenoise==6.8.2",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
excel-recovery = [
  "lxml>=5.0.0",
  "XlsxWriter>=3.2.0",
]

[tool.setuptools.packages.find]
include = ["events*", "jumar*"]
